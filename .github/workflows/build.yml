name: Build VoxShift - X

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.1.0"

jobs:
  macos:
    # Intel runner builds a universal (Apple Silicon + Intel) binary and is usually free.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect and sign plugins
        run: |
          set -e
          mkdir -p out
          cp -R "build/VoxShiftX_artefacts/Release/VST3/VoxShift - X.vst3" out/
          cp -R "build/VoxShiftXAU_artefacts/Release/AU/VoxShift - X.component" out/
          cp -R "build/VoxShiftXMidiAU_artefacts/Release/AU/VoxShift - X MIDI.component" out/
          for p in out/*; do codesign --force --deep -s - "$p"; done
          lipo -info "out/VoxShift - X.component/Contents/MacOS/VoxShift - X"
          # fail if the binaries need a newer macOS than 10.13
          for b in "out/VoxShift - X.component/Contents/MacOS/VoxShift - X" "out/VoxShift - X MIDI.component/Contents/MacOS/VoxShift - X MIDI" "out/VoxShift - X.vst3/Contents/MacOS/VoxShift - X"; do
            MINOS=$(/usr/bin/otool -l "$b" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "$b -> minimum macOS $MINOS"
            [ "$MINOS" = "10.13" ] || { echo "Wrong deployment target"; exit 1; }
          done

      - name: Validate Audio Units with auval (same check Logic runs)
        run: |
          set -e
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R out/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -a | grep -i Tntk || true
          auval -strict -v aufx Vsfx Tntk
          auval -strict -v aumf Vsfm Tntk

      - name: Validate with pluginval (AU + VST3)
        run: |
          set -e
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 8 --validate-in-process --sample-rates 44100,48000,96000 --block-sizes 64,512,2048 --validate "out/VoxShift - X.vst3"
          $PV --strictness-level 8 --validate-in-process --sample-rates 44100,48000,96000 --block-sizes 64,512,2048 --validate ~/Library/Audio/Plug-Ins/Components/"VoxShift - X.component"

      - name: Build installer (.pkg)
        run: |
          set -e
          ID="com.tunetalks.voxshiftx"
          mkdir -p root/vst3 root/au pkgs installer
          cp -R "out/VoxShift - X.vst3" root/vst3/
          cp -R "out/VoxShift - X.component" "out/VoxShift - X MIDI.component" root/au/
          pkgbuild --root root/vst3 --identifier "$ID.vst3" --version "$VERSION" --install-location "/Library/Audio/Plug-Ins/VST3" pkgs/vst3.pkg
          pkgbuild --root root/au   --identifier "$ID.au"   --version "$VERSION" --install-location "/Library/Audio/Plug-Ins/Components" pkgs/au.pkg
          cat > distribution.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>VoxShift - X by Tune Talks</title>
              <organization>com.tunetalks</organization>
              <options customize="allow" require-scripts="false" hostArchitectures="arm64,x86_64"/>
              <domains enable_localSystem="true"/>
              <choices-outline>
                  <line choice="au"/>
                  <line choice="vst3"/>
              </choices-outline>
              <choice id="au" title="Audio Unit (Logic Pro, GarageBand, Ableton Live)" description="VoxShift - X (effetto) e VoxShift - X MIDI (controllabile con le note) in /Library/Audio/Plug-Ins/Components">
                  <pkg-ref id="$ID.au"/>
              </choice>
              <choice id="vst3" title="VST3 (Ableton Live 10.1+, altri DAW)" description="VoxShift - X in /Library/Audio/Plug-Ins/VST3">
                  <pkg-ref id="$ID.vst3"/>
              </choice>
              <pkg-ref id="$ID.au" version="$VERSION">au.pkg</pkg-ref>
              <pkg-ref id="$ID.vst3" version="$VERSION">vst3.pkg</pkg-ref>
          </installer-gui-script>
          XML
          sed -i '' 's/^          //' distribution.xml
          productbuild --distribution distribution.xml --package-path pkgs "installer/VoxShift - X Installer.pkg"
          ls -la installer

      - uses: actions/upload-artifact@v4
        with:
          name: VoxShiftX-macOS
          path: |
            installer/*.pkg
            out

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES="VoxShift - X $VERSION by Tune Talks. Compatibile con Logic Pro (X 10.4 e successivi) e Ableton Live (AU su Mac, VST3 da Live 10.1 su Mac e Windows). Installer macOS universale (Apple Silicon + Intel): AU effetto, AU MIDI-controlled, VST3. Validato con auval e pluginval."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "installer/VoxShift - X Installer.pkg" --clobber
          else
            gh release create "$TAG" "installer/VoxShift - X Installer.pkg" --title "VoxShift - X v$VERSION" --notes "$NOTES"
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release --parallel --target VoxShiftX_VST3

      - name: Validate with pluginval (VST3)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          .\pv\pluginval.exe --strictness-level 8 --verbose --sample-rates 44100,48000,96000 --block-sizes 64,512,2048 --validate "build\VoxShiftX_artefacts\Release\VST3\VoxShift - X.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: VoxShiftX-Windows-VST3
          path: build/VoxShiftX_artefacts/Release/VST3
